name: 📈 Daily Morning Digest

on:
  schedule:
    - cron: '0 3 * * 1-5'   # 7:00 AM GST (UTC+4) Mon-Fri
  workflow_dispatch:

jobs:
  send-digest:
    name: Run Portfolio Digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Run digest
        working-directory: server
        env:
          GMAIL_USER:                  ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:          ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT:             ${{ secrets.EMAIL_RECIPIENT }}
          TWELVE_DATA_API_KEY:         ${{ secrets.TWELVE_DATA_API_KEY }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_CSV_URL:        ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME:           ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NODE_ENV: production
        run: node scripts/digest.js

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: server/digest-output.json
          retention-days: 30
          if-no-files-found: ignore
