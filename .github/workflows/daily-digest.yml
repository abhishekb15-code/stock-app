name: 📈 Daily Morning Digest

on:
  schedule:
    - cron: '0 3 * * 1-5'   # 7:00 AM GST (UTC+4) Mon-Fri
  workflow_dispatch:

jobs:
  send-digest:
    name: Run Portfolio Digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Test Yahoo Finance connectivity
        working-directory: server
        run: |
          echo "🔍 Testing Yahoo Finance access..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            -H "Accept: application/json" \
            "https://query1.finance.yahoo.com/v8/finance/chart/RELIANCE.NS?interval=1d&range=1d")
          echo "Yahoo Finance v8 status: $STATUS"
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -H "User-Agent: Mozilla/5.0" \
            "https://query2.finance.yahoo.com/v7/finance/quote?symbols=RELIANCE.NS")
          echo "Yahoo Finance v7 status: $STATUS2"

      - name: Run digest script
        working-directory: server
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          NODE_ENV: production
        run: node scripts/digest.js

      - name: Upload digest log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-log-${{ github.run_id }}
          path: server/digest-output.json
          retention-days: 30
          if-no-files-found: ignore
