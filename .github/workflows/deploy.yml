name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend
        run: |
          cd client && npm install && CI=false npm run build
          echo "Frontend built successfully"

      - name: Install server deps & syntax check
        run: |
          cd server && npm install
          node --check index.js
          node --check models/db.js
          node --check services/analysisEngine.js
          echo "Server syntax OK"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            RESPONSE=$(curl -s -X POST "$RENDER_DEPLOY_HOOK")
            echo "Render response: $RESPONSE"
            echo "Deploy hook triggered"
          else
            echo "No RENDER_DEPLOY_HOOK secret set - skipping (Render auto-deploys via its own GitHub integration)"
          fi

      - name: Summary
        run: |
          {
            echo "## Build check complete"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | Build and syntax checks passed |"
            echo "| **Dashboard** | https://dashboard.render.com |"
          } >> "$GITHUB_STEP_SUMMARY"
