name: 🚀 Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend
        run: |
          cd client && npm install && CI=false npm run build
          echo "✅ Frontend built successfully"

      - name: Install server deps & syntax check
        run: |
          cd server && npm install
          node --check index.js
          node --check models/db.js
          node --check services/analysisEngine.js
          echo "✅ Server syntax OK"

      - name: Trigger Render deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render response: $RESPONSE"
          echo "✅ Deploy triggered"

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🚀 Deployed to Render

          | | |
          |---|---|
          | **Status** | ✅ Deploy triggered |
          | **Dashboard** | https://dashboard.render.com |
          | **Live in** | ~2 minutes |
          EOF
