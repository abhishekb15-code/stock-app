name: 🚀 Open App in Browser

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'App URL to open'
        required: false
        default: 'http://localhost:5000'
        type: string
      page:
        description: 'Which page to open'
        required: false
        default: 'dashboard'
        type: choice
        options:
          - dashboard
          - portfolio
          - whales
          - stock/RELIANCE
          - stock/TCS
          - stock/INFY
          - stock/HDFCBANK

jobs:
  open-app:
    name: Open App & Run Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Build React frontend
        run: CI=false npm run build
        working-directory: client

      - name: Start server (serves API + React on port 5000)
        working-directory: server
        env:
          NODE_ENV: production
          PORT: 5000
        run: |
          node index.js &
          echo "⏳ Waiting for server to start..."
          sleep 8

      - name: Health check
        run: |
          curl -sf http://localhost:5000/api/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('✅ Server healthy')
          print(f'   Market        : {d[\"market\"]}')
          print(f'   Provider      : {d[\"dataProvider\"]}')
          print(f'   Serves UI     : {d[\"servesFrontend\"]}')
          "

      - name: Build URL and print instructions
        id: build-url
        run: |
          BASE="${{ github.event.inputs.app_url }}"
          PAGE="${{ github.event.inputs.page }}"
          case "$PAGE" in
            dashboard) SUFFIX="/" ;;
            portfolio) SUFFIX="/portfolio" ;;
            whales)    SUFFIX="/whales" ;;
            *)         SUFFIX="/$PAGE" ;;
          esac
          FULL_URL="${BASE%/}${SUFFIX}"
          echo "full_url=$FULL_URL" >> $GITHUB_OUTPUT
          echo "path_suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐  OPEN THIS URL IN YOUR BROWSER:"
          echo ""
          echo "    $FULL_URL"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "💡 Single command to run the app locally:"
          echo "   cd server && node index.js"
          echo "   Then open: http://localhost:5000$SUFFIX"

      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Stock Intelligence App

          | | |
          |---|---|
          | **URL** | \`${{ steps.build-url.outputs.full_url }}\` |
          | **Page** | ${{ github.event.inputs.page }} |
          | **Backend health** | ✅ Verified |
          | **Frontend** | ✅ Built & served from Express |

          ### 👉 Open in your browser
          [${{ steps.build-url.outputs.full_url }}](${{ steps.build-url.outputs.full_url }})

          ---

          ### Run locally (single command)
          \`\`\`bash
          # Step 1 — build frontend once
          cd client && npm run build

          # Step 2 — start server (serves UI + API on port 5000)
          cd server && node index.js
          \`\`\`

          Then open **http://localhost:5000** in your browser.
          EOF
