name: 🚀 Open App in Browser

on:
  workflow_dispatch:
    inputs:
      page:
        description: 'Which page to open'
        required: false
        default: 'dashboard'
        type: choice
        options:
          - dashboard
          - portfolio
          - whales
          - stock/RELIANCE
          - stock/TCS
          - stock/INFY
          - stock/HDFCBANK
      duration:
        description: 'Keep alive for how long?'
        required: false
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '20'
          - '30'

jobs:
  open-app:
    name: 🌐 Serve App with Public URL
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server && npm install
          cd ../client && npm install

      - name: Build React frontend
        run: CI=false npm run build
        working-directory: client

      - name: Start app server
        working-directory: server
        env:
          NODE_ENV: production
          PORT: 5000
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          node index.js &
          sleep 6
          curl -sf http://localhost:5000/api/health > /dev/null && echo "✅ Server started" || echo "❌ Server failed"

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start tunnel & get public URL
        id: tunnel
        run: |
          # Start tunnel in background, pipe output to log
          cloudflared tunnel --url http://localhost:5000 --no-autoupdate 2>&1 &
          echo "⏳ Waiting for tunnel URL..."
          sleep 12

          # Extract the public URL from cloudflared output
          URL=$(cloudflared tunnel --url http://localhost:5000 --no-autoupdate 2>&1 &
                sleep 8
                curl -s http://localhost:4040/api/tunnels 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['tunnels'][0]['public_url'])" 2>/dev/null || true)

          # Alternative: parse from cloudflared metrics
          TUNNEL_URL=$(curl -s http://localhost:20241/metrics 2>/dev/null | grep -o 'https://[^"]*\.trycloudflare\.com' | head -1 || true)

          if [ -z "$TUNNEL_URL" ]; then
            # Restart and capture URL from stderr
            pkill cloudflared 2>/dev/null || true
            sleep 2
            cloudflared tunnel --url http://localhost:5000 --no-autoupdate > /tmp/cf.log 2>&1 &
            sleep 15
            TUNNEL_URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' /tmp/cf.log | head -1)
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT
          echo ""
          echo "🌐 Public URL: $TUNNEL_URL"

      - name: Get page path
        id: page
        run: |
          PAGE="${{ github.event.inputs.page }}"
          case "$PAGE" in
            dashboard) SUFFIX="" ;;
            portfolio) SUFFIX="/portfolio" ;;
            whales)    SUFFIX="/whales" ;;
            *)         SUFFIX="/$PAGE" ;;
          esac
          FULL="${{ steps.tunnel.outputs.tunnel_url }}${SUFFIX}"
          echo "full_url=$FULL" >> $GITHUB_OUTPUT
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

      - name: 🎯 Print clickable URL
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║                                                          ║"
          echo "║   🌐  CLICK THIS LINK TO OPEN THE APP:                  ║"
          echo "║                                                          ║"
          echo "║   ${{ steps.page.outputs.full_url }}"
          echo "║                                                          ║"
          echo "║   ⏰  Live for ${{ github.event.inputs.duration }} minutes                          ║"
          echo "║                                                          ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""

      - name: Write summary with clickable link
        run: |
          PAGE_URL="${{ steps.page.outputs.full_url }}"
          BASE_URL="${{ steps.tunnel.outputs.tunnel_url }}"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 Stock Intelligence App is LIVE

          ## 👇 Click to open

          # [${{ github.event.inputs.page }} → $PAGE_URL]($PAGE_URL)

          ---

          | | |
          |---|---|
          | **Base URL** | $BASE_URL |
          | **Page** | ${{ github.event.inputs.page }} |
          | **Live for** | ${{ github.event.inputs.duration }} minutes |

          ## All pages
          | Page | Link |
          |------|------|
          | Dashboard | [$BASE_URL]($BASE_URL) |
          | Portfolio | [$BASE_URL/portfolio]($BASE_URL/portfolio) |
          | Whale Signals | [$BASE_URL/whales]($BASE_URL/whales) |
          | RELIANCE | [$BASE_URL/stock/RELIANCE.NS]($BASE_URL/stock/RELIANCE.NS) |
          | TCS | [$BASE_URL/stock/TCS.NS]($BASE_URL/stock/TCS.NS) |
          EOF

      - name: Keep alive for selected duration
        run: |
          MINS=${{ github.event.inputs.duration }}
          echo "⏳ App is live at ${{ steps.tunnel.outputs.tunnel_url }}"
          echo "   Keeping alive for ${MINS} minutes..."
          sleep $((MINS * 60))
          echo "🛑 Session ended."
