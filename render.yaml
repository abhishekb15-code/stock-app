services:
  - type: web
    name: stock-intelligence
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
      # Skip React sourcemap generation — big memory + time saver so the client
      # build doesn't OOM on the 512 MB free-tier builder.
      - key: GENERATE_SOURCEMAP
        value: false
      - key: CI
        value: false
      - key: PORT
        value: 10000
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_RECIPIENT
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
